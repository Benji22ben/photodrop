[project]
name = "heic-to-jpg"
version = "1.0.0"
description = "A small self-hosted HEIC to JPG batch converter, powered by libheif."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pillow>=11,<13", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
